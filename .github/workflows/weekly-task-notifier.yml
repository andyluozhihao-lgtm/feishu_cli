name: Weekly Task Notifier

on:
  schedule:
    # 10:13 Asia/Shanghai. GitHub Actions cron uses UTC.
    - cron: "13 2 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install lark-cli
        run: npm install -g @larksuite/cli

      - name: Configure Feishu app credentials
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          test -n "$LARK_APP_ID"
          test -n "$LARK_APP_SECRET"
          printf '%s' "$LARK_APP_SECRET" | lark-cli config init --app-id "$LARK_APP_ID" --app-secret-stdin --brand feishu

      - name: Send weekly task reminder
        env:
          LARK_IDENTITY: bot
          LARK_WEBHOOK_URL: ${{ secrets.LARK_WEBHOOK_URL }}
          LARK_WEBHOOK_SECRET: ${{ secrets.LARK_WEBHOOK_SECRET }}
          LARK_BASE_TOKEN: ${{ vars.LARK_BASE_TOKEN }}
          LARK_TABLE_ID: ${{ vars.LARK_TABLE_ID }}
          LARK_VIEW_ID: ${{ vars.LARK_VIEW_ID }}
          BASE_URL: ${{ vars.BASE_URL }}
          ACTIVE_STATUSES: ${{ vars.ACTIVE_STATUSES }}
          INCLUDE_UNASSIGNED: ${{ vars.INCLUDE_UNASSIGNED }}
        run: npm run notify
